<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campus 84">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9f4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06121d" media="(prefers-color-scheme: dark)">
<title>Campus ISFD 84 · Mi app</title>
<style>
:root{
  color-scheme:light dark;
  --ink:#0b1b2b;--mut:#43596c;--brandT:#0a6aa0;--redT:#c4231d;
  --blue:#0a7dba;--blue2:#1aa6e6;--red:#d92d27;
  --ga:.42;--g-bg:rgba(255,255,255,var(--ga));--g-sheen:rgba(255,255,255,.55);
  --g-line:rgba(255,255,255,.9);--g-line2:rgba(255,255,255,.45);
  --g-shadow:0 10px 30px rgba(8,70,110,.14);
  --field:rgba(255,255,255,.62);--sheet:rgba(240,248,254,.8);
  --chipBg:rgba(255,255,255,.55);--chk:rgba(67,89,108,.5);--tabOn:rgba(255,255,255,.78);
  --page:#e9f4fb;--spring:cubic-bezier(.3,1.35,.5,1);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]){
    --ink:#eaf4fb;--mut:#a3bccf;--brandT:#6ccaf8;--redT:#ff8a80;
    --ga:.5;--g-bg:rgba(22,46,70,var(--ga));--g-sheen:rgba(255,255,255,.17);
    --g-line:rgba(255,255,255,.3);--g-line2:rgba(255,255,255,.13);
    --g-shadow:0 12px 32px rgba(0,0,0,.35);
    --field:rgba(255,255,255,.08);--sheet:rgba(12,28,44,.78);
    --chipBg:rgba(255,255,255,.1);--chk:rgba(163,188,207,.55);--tabOn:rgba(255,255,255,.16);
    --page:#06121d;
  }
}
:root[data-theme=dark]{
    --ink:#eaf4fb;--mut:#a3bccf;--brandT:#6ccaf8;--redT:#ff8a80;
    --ga:.5;--g-bg:rgba(22,46,70,var(--ga));--g-sheen:rgba(255,255,255,.17);
    --g-line:rgba(255,255,255,.3);--g-line2:rgba(255,255,255,.13);
    --g-shadow:0 12px 32px rgba(0,0,0,.35);
    --field:rgba(255,255,255,.08);--sheet:rgba(12,28,44,.78);
    --chipBg:rgba(255,255,255,.1);--chk:rgba(163,188,207,.55);--tabOn:rgba(255,255,255,.16);
    --page:#06121d;
  }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--page)}
html,body{margin:0}
body{background:transparent;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(170px + env(safe-area-inset-bottom));min-height:100vh}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---- fondo con los tonos del logo ---- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(165deg,#e1f1fb 0%,#f2f8fc 48%,#fdeceb 100%)}
.bg i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--c) 0%,var(--c) 22%,transparent 100%)}
.bg .b1{--c:rgba(43,180,238,.7);width:130vw;height:130vw;max-width:760px;max-height:760px;left:-48vw;top:-22vh}
.bg .b2{--c:rgba(13,111,184,.38);width:120vw;height:120vw;max-width:720px;max-height:720px;right:-58vw;top:26vh}
.bg .b3{--c:rgba(255,90,79,.55);width:124vw;height:124vw;max-width:740px;max-height:740px;left:-40vw;bottom:-26vh}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .bg{background:linear-gradient(165deg,#05111b 0%,#0a1b2b 50%,#1a0c11 100%)}
:root:not([data-theme=light]) .bg .b1{--c:rgba(11,143,210,.5)}
:root:not([data-theme=light]) .bg .b2{--c:rgba(10,79,140,.5)}
:root:not([data-theme=light]) .bg .b3{--c:rgba(200,38,31,.42)}
}
:root[data-theme=dark] .bg{background:linear-gradient(165deg,#05111b 0%,#0a1b2b 50%,#1a0c11 100%)}
:root[data-theme=dark] .bg .b1{--c:rgba(11,143,210,.5)}
:root[data-theme=dark] .bg .b2{--c:rgba(10,79,140,.5)}
:root[data-theme=dark] .bg .b3{--c:rgba(200,38,31,.42)}


/* ---- vidrio (Liquid Glass) ---- */
.hero,.tile,.card,.item,.link-row,.chips,.tabs,.btn.ghost,.empty,.warn{
  background:linear-gradient(180deg,var(--g-sheen) 0%,rgba(255,255,255,0) 55%),var(--g-bg);
  border:1px solid var(--g-line2);
  box-shadow:inset 0 1px 0 var(--g-line),inset 0 -1px 0 var(--g-line2),var(--g-shadow);
}
.empty{border-style:dashed;box-shadow:none}

.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 2px}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo-plate{flex:none;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.7),0 6px 16px rgba(10,100,160,.28)}
.logo-plate img{width:90%;height:90%;object-fit:contain;display:block}
.logo-plate.big{width:80px;height:80px}
.top b{display:block;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.top small{display:block;color:var(--mut);font-size:13px}
.top small::first-letter{text-transform:uppercase}

main{max-width:560px;margin:0 auto;padding:16px}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  margin:26px 6px 10px;display:flex;align-items:center;justify-content:space-between}
.mini{background:none;border:0;color:var(--brandT);font-weight:700;font-size:14px;letter-spacing:0;text-transform:none;padding:6px 4px;cursor:pointer}

.hero{border-radius:28px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 48%),
             linear-gradient(135deg,rgba(26,166,230,.4),rgba(26,166,230,.12) 58%,rgba(240,71,63,.16));}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .hero{background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 48%),
             linear-gradient(135deg,rgba(26,166,230,.3),rgba(26,166,230,.08) 58%,rgba(240,71,63,.16))}
}
:root[data-theme=dark] .hero{background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 48%),
             linear-gradient(135deg,rgba(26,166,230,.3),rgba(26,166,230,.08) 58%,rgba(240,71,63,.16))}

.hero-top{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--redT)}
.hero h1{font-size:18.5px;line-height:1.22;margin:3px 0 2px;letter-spacing:-.01em}
.hero .sub{color:var(--mut);font-size:13.5px}
.hero .btn.ghost{margin-top:10px}
.hero .hint{margin-top:12px;font-size:13px;color:var(--mut);display:flex;gap:7px;align-items:flex-start}
.hero .hint svg{flex:none;margin-top:2px;color:var(--brandT)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;
  border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;width:100%;color:var(--ink)}
.btn.cta,.btn.primary{color:#fff;border-color:rgba(255,255,255,.5);
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 52%),linear-gradient(180deg,#0f86c4,#086fa6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.18),0 8px 20px rgba(10,125,186,.38)}
.btn.danger{color:#fff;border-color:rgba(255,255,255,.5);
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 52%),linear-gradient(180deg,#e0362f,#b8211b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 20px rgba(217,45,39,.34)}
.btn.ghost{box-shadow:inset 0 1px 0 var(--g-line)}
.btn:active{transform:scale(.985);filter:brightness(1.05)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:104px}
.tile .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px;color:var(--brandT);
  background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.15));
  box-shadow:inset 0 1px 0 var(--g-line),0 2px 8px rgba(10,100,160,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .tile .ic{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04))}
}
:root[data-theme=dark] .tile .ic{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04))}

.tile b{font-size:15px}
.tile small{color:var(--mut);font-size:12.5px;line-height:1.3}

.card{border-radius:24px;padding:14px}
.empty{text-align:center;color:var(--mut);padding:26px 18px;border-radius:24px;font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.warn{border-radius:18px;padding:11px 14px;font-size:13.5px;margin-bottom:14px;color:var(--redT);
  background:linear-gradient(180deg,var(--g-sheen),rgba(255,255,255,0) 60%),rgba(217,45,39,.12)}
.hint{color:var(--mut);font-size:13px}

.link-row{display:flex;align-items:center;gap:6px;border-radius:20px;margin-bottom:8px}
.link-row a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 8px 13px 16px;color:var(--ink);text-decoration:none}
.link-row a svg{color:var(--brandT);flex:none}
.link-row a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ib{background:none;border:0;color:var(--mut);width:44px;height:44px;font-size:22px;cursor:pointer}

.chips{display:flex;gap:4px;padding:4px;border-radius:999px;margin-bottom:6px}
.fchip{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut);white-space:nowrap}
.fchip.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 52%),linear-gradient(180deg,#0f86c4,#086fa6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(10,125,186,.35)}

.group{margin-bottom:6px}
.group-t{font-size:12.5px;font-weight:700;color:var(--mut);margin:20px 6px 8px;text-transform:uppercase;letter-spacing:.08em}
.group.late .group-t{color:var(--redT)}
.item{display:flex;gap:12px;align-items:flex-start;border-radius:22px;padding:13px;margin-bottom:10px}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--chk);background:transparent;display:grid;place-items:center;cursor:pointer;color:#fff;margin-top:1px}
.check.on{border-color:rgba(255,255,255,.7);background:linear-gradient(180deg,#1aa6e6,#086fa6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.item-b{flex:1;min-width:0;cursor:pointer}
.item-t{font-weight:700;overflow-wrap:anywhere}
.item-m{color:var(--mut);font-size:13.5px;margin-top:1px}
.item-n{color:var(--mut);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item-x{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.item.is-done .item-t{text-decoration:line-through;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chipBg);border:1px solid var(--g-line2);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;max-width:100%}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--chipBg);color:var(--mut);border:1px solid var(--g-line2)}
.tag.late{background:rgba(217,45,39,.14);color:#b3211c;border-color:rgba(217,45,39,.25)}
.tag.soon{background:rgba(10,125,186,.14);color:#075f92;border-color:rgba(10,125,186,.25)}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .tag.late{background:rgba(255,110,100,.18);color:#ff9d94;border-color:rgba(255,110,100,.3)}
:root:not([data-theme=light]) .tag.soon{background:rgba(60,180,240,.18);color:#86d4f8;border-color:rgba(60,180,240,.3)}
}
:root[data-theme=dark] .tag.late{background:rgba(255,110,100,.18);color:#ff9d94;border-color:rgba(255,110,100,.3)}
:root[data-theme=dark] .tag.soon{background:rgba(60,180,240,.18);color:#86d4f8;border-color:rgba(60,180,240,.3)}


.mat{display:flex;gap:12px;align-items:stretch;margin-bottom:10px;cursor:pointer;padding:0;overflow:hidden;border-radius:22px}
.mat::before{content:"";width:9px;background:linear-gradient(180deg,var(--c),var(--c));flex:none;box-shadow:inset -1px 0 0 rgba(255,255,255,.4)}
.mat-b{flex:1;min-width:0;padding:14px 0;display:flex;flex-direction:column;gap:2px}
.mat-b b{overflow-wrap:anywhere}
.mat-b span{color:var(--mut);font-size:13.5px}
.mat-n{padding:14px 16px 14px 0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;font-size:12.5px;color:var(--mut);white-space:nowrap}


input,select,textarea{width:100%;min-width:0;max-width:100%;background:var(--field);border:1px solid var(--g-line2);border-radius:16px;padding:12px 14px;font-size:16px;margin-top:6px;
  box-shadow:inset 0 1px 3px rgba(10,60,100,.14)}
textarea{resize:vertical;line-height:1.4}
::placeholder{color:var(--mut);opacity:.8}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;height:50px;min-height:50px;line-height:1.2;text-align:left;overflow:hidden}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
input[type=date]::-webkit-datetime-edit,input[type=time]::-webkit-datetime-edit{padding:0}
@supports (-webkit-touch-callout:none){input[type=time].blank::before,input[type=date].blank::before{content:attr(data-ph);color:var(--mut);opacity:.8}}
.sheet{overflow-x:hidden}
label,.lbl{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-top:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>label{min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);outline-offset:0;border-color:transparent}

.fab{position:fixed;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  color:#fff;border:1px solid rgba(255,255,255,.55);display:grid;place-items:center;cursor:pointer;z-index:20;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 52%),linear-gradient(135deg,#f0473f,#c4231d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 6px rgba(120,10,6,.25),0 12px 26px rgba(217,45,39,.42)}
.fab:active{transform:scale(.95)}

.tabs{position:fixed;left:0;right:0;margin:0 auto;width:calc(100% - 24px);max-width:480px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;
  border-radius:34px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:28px;pointer-events:none;z-index:0;will-change:transform;
  transform:translate3d(0,0,0);scale:1;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--tabOn);
  box-shadow:inset 0 1px 0 var(--g-line),0 3px 10px rgba(10,100,160,.18);
  transition:transform .5s var(--spring),scale .35s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s}
.tabs.pressed .pill{scale:1.16 1.1;transition:scale .3s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.25)),rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1.5px rgba(255,255,255,.75),0 8px 20px rgba(10,125,186,.34)}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .tabs.pressed .pill{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.08)),rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1.5px rgba(255,255,255,.35),0 8px 20px rgba(26,166,230,.36)}
}
:root[data-theme=dark] .tabs.pressed .pill{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.08)),rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1.5px rgba(255,255,255,.35),0 8px 20px rgba(26,166,230,.36)}

.tab{position:relative;z-index:1;background:none;border:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;color:var(--mut);font-size:11.5px;font-weight:700;cursor:pointer;min-height:56px;transition:color .2s}
.tab svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tab.on{color:var(--brandT)}
.tabs.pressed .tab.on:not(.hot){color:var(--mut)}
.tabs.pressed .tab.hot{color:var(--brandT)}
.tabs.pressed .tab.hot svg{transform:scale(1.28)}

.overlay{position:fixed;inset:0;background:rgba(5,18,30,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,var(--g-sheen) 0%,rgba(255,255,255,0) 40%),var(--sheet);
  -webkit-backdrop-filter:blur(36px) saturate(1.8);backdrop-filter:blur(36px) saturate(1.8);
  width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;border:1px solid var(--g-line);border-bottom:0;
  box-shadow:inset 0 1px 0 var(--g-line),0 -10px 40px rgba(5,40,70,.25);
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s ease-out}
@keyframes up{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sheet-h h2{font-size:20px;letter-spacing:-.01em}
.x{background:var(--chipBg);border:1px solid var(--g-line2);box-shadow:inset 0 1px 0 var(--g-line);border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;color:var(--mut)}
.actions{display:grid;gap:10px;margin-top:18px}
.err{color:var(--redT);font-size:13.5px;margin-top:10px;min-height:1em;font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 0 0 2px rgba(255,255,255,.35)}
.sw.on{border-color:var(--ink)}
.sheet p.msg{margin:10px 0 0;color:var(--mut)}
.foot{margin:26px 8px 0;text-align:center;font-size:12px;color:var(--mut)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)),rgba(8,24,38,.82);color:#fff;border:1px solid rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}

/* sin soporte de desenfoque o con "reducir transparencia": paneles más opacos */

/* ---- agenda: modo lista/mes, calendario ---- */
.chips.narrow{max-width:240px;margin-bottom:10px}
.chips.mini-seg{margin:0;padding:3px}
.chips.mini-seg .fchip{padding:8px 4px;font-size:13px}
.tag.rep{color:var(--brandT)}
.tag.live{background:rgba(31,143,95,.16);color:#14724b;border-color:rgba(31,143,95,.32)}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]) .tag.live{background:rgba(47,180,124,.2);color:#7ce3b4;border-color:rgba(47,180,124,.34)}
}

.cal{padding:12px 8px 10px}
.cal-h{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.cal-h b{flex:1;text-align:center;text-transform:capitalize;font-size:16px;cursor:pointer}
.cal-h .ib{font-size:26px;width:40px;height:40px;line-height:1}
.cal-h .mini{padding:6px 10px;font-size:13px}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-w{text-align:center;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:2px}
.cal-g{gap:2px}
.cd{border:0;background:transparent;border-radius:14px;min-height:48px;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--ink);font-weight:600;font-size:15px}
.cd span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.cd.out{color:var(--mut);opacity:.45}
.cd.today span{background:linear-gradient(180deg,#1591d0,#086fa6);color:#fff}
.cd.sel span{box-shadow:inset 0 0 0 2px var(--brandT)}
.cd.today.sel span{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--brandT)}
.cd i{display:flex;gap:3px;height:6px;font-style:normal}
.cd u{display:block;width:6px;height:6px;border-radius:50%;background:var(--c);text-decoration:none}

/* ---- horario semanal ---- */
.group-t.today{color:var(--brandT)}
.group-t .tag{text-transform:none;letter-spacing:0;margin-left:6px}
.none{color:var(--mut);font-size:13.5px;padding:0 8px 4px}
.cls{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:0;overflow:hidden;cursor:pointer;border-radius:22px}
.cls::before{content:"";align-self:stretch;width:9px;background:var(--c);flex:none}
.cls-t{flex:none;width:50px;display:flex;flex-direction:column;padding:12px 0;font-variant-numeric:tabular-nums}
.cls-t b{font-size:16px;line-height:1.2}
.cls-t span{color:var(--mut);font-size:13px}
.cls-b{flex:1;min-width:0;padding:12px 0;display:flex;flex-direction:column;gap:1px}
.cls-b b{overflow-wrap:anywhere}
.cls-b span{color:var(--mut);font-size:13.5px;overflow-wrap:anywhere}
.cls .tag{margin-right:12px;flex:none}
.mat-b .cl{font-variant-numeric:tabular-nums}

/* ---- horarios dentro del formulario de materia ---- */
.crow{background:var(--chipBg);border:1px solid var(--g-line2);border-radius:20px;padding:10px 10px 12px;margin-top:10px}
.crow-top{display:flex;gap:6px;align-items:center}
.crow-top select{margin-top:0;flex:1}
.crow .row2 label{margin-top:8px}
.addrow{margin-top:10px;min-height:44px}

/* ---- apariencia ---- */
.set{display:flex;flex-direction:column;gap:16px}
.set-r{display:flex;flex-direction:column;gap:8px}
.set-r>span{font-weight:700;font-size:14px}
.set-sc{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
input[type=range]{padding:0;height:32px;margin:0;background:none;border:0;box-shadow:none;accent-color:var(--blue2)}

function load(){
  try{
    localStorage.setItem("__t","1");localStorage.removeItem("__t");
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);["materias","eventos","apuntes","links"].forEach(function(k){if(Array.isArray(o[k]))S[k]=o[k]});if(o.ui&&typeof o.ui==="object")S.ui=o.ui}
  }catch(e){canStore=false}
  normalize();
}
function normalize(){
  S.ui=Object.assign({theme:"auto",glass:null,spring:"normal"},S.ui&&typeof S.ui==="object"?S.ui:{});
  S.materias.forEach(function(m){m.clases=(Array.isArray(m.clases)?m.clases:[]).filter(function(c){return c&&c.ini})});
  S.eventos.forEach(function(e){if(e.rep&&!Array.isArray(e.done))e.done=[]});
}
/* apariencia: modo, transparencia del vidrio y rebote de la barra */
var SPRINGS={soft:"cubic-bezier(.3,1.1,.5,1)",normal:"cubic-bezier(.3,1.35,.5,1)",strong:"cubic-bezier(.3,1.75,.5,1)"};
function isDark(){var t=S.ui.theme;return t==="dark"||(t!=="light"&&!!window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function applyUI(){
  var r=document.documentElement,u=S.ui;
  if(u.theme==="light"||u.theme==="dark")r.setAttribute("data-theme",u.theme);else r.removeAttribute("data-theme");
  if(u.glass==null)r.style.removeProperty("--ga");else r.style.setProperty("--ga",(0.2+0.65*u.glass).toFixed(3));
  r.style.setProperty("--spring",SPRINGS[u.spring]||SPRINGS.normal);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false}}
function commit(){save();render()}

/* ---------- estado de UI ---------- */
var view="campus",filter="pend",agMode="list";
var calY=0,calM=0,calSel="";

function matById(id){return S.materias.find(function(m){return m.id===id})}
function chip(id){var m=matById(id);return m?'<span class="chip" style="--c:'+esc(m.color)+'"><i></i><span>'+esc(m.nombre)+'</span></span>':""}
function cmp(a,b){return (a.fecha+(a.hora||"99:99")).localeCompare(b.fecha+(b.hora||"99:99"))}
function normUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;try{var x=new URL(u);return (x.protocol==="http:"||x.protocol==="https:")&&x.hostname.indexOf(".")>0?x.href:""}catch(e){return ""}}

/* ---------- vistas ---------- */
function evItem(e){
  var n=diffDays(e.fecha),tag="";
  if(!e.hecho){tag='<span class="tag'+(n<0?" late":n<=1?" soon":"")+'">'+rel(n)+'</span>'}
  var rp=e.rep?'<span class="tag rep">↻ '+REPS[e.rep]+'</span>':"";
  return '<div class="item'+(e.hecho?" is-done":"")+'">'+
    '<button class="check'+(e.hecho?" on":"")+'" data-act="toggle" data-id="'+e.id+'" data-d="'+e.fecha+'" aria-label="'+(e.hecho?"Marcar como pendiente":"Marcar como hecha")+'">'+(e.hecho?ico("check",16):"")+'</button>'+
    '<div class="item-b" data-act="ev" data-id="'+e.id+'">'+
      '<div class="item-t">'+esc(e.titulo)+'</div>'+
      '<div class="item-m">'+esc(e.tipo)+' · '+fmtDate(e.fecha)+(e.hora?' · '+esc(e.hora)+' hs':'')+'</div>'+
      (e.nota?'<div class="item-n">'+esc(e.nota)+'</div>':'')+
      '<div class="item-x">'+chip(e.materia)+tag+rp+'</div>'+
    '</div></div>';
}

/* eventos para la lista: los que se repiten muestran solo su próxima fecha pendiente */
function listItems(){
  var t=iso(today0()),out=[];
  S.eventos.forEach(function(e){
    if(!e.rep){out.push(e);return}
    var d=nextOcc(e,t);
    if(d)out.push(Object.assign({},e,{fecha:d,hecho:false}));
  });
  return out;
}
function itemsOn(d){
  var out=[];
  S.eventos.forEach(function(e){if(occIn(e,d,d).length)out.push(Object.assign({},e,{fecha:d,hecho:isDone(e,d)}))});
  return out.sort(function(a,b){return (a.hora||"99:99").localeCompare(b.hora||"99:99")});
}

/* clases del horario semanal */
function classesOn(dow){
  var out=[];
  S.materias.forEach(function(m){(m.clases||[]).forEach(function(c){if(+c.d===dow)out.push({m:m,c:c})})});
  return out.sort(function(a,b){return a.c.ini.localeCompare(b.c.ini)});
}
function classStates(list,isToday){
  var st=list.map(function(){return ""});
  if(!isToday)return st;
  var n=nowMin(),nextSet=false;
  list.forEach(function(x,i){
    var a=toMin(x.c.ini),b=x.c.fin?toMin(x.c.fin):a+60;
    if(n>=a&&n<b)st[i]="now";
    else if(n<a&&!nextSet){st[i]="next";nextSet=true}
  });
  return st;
}
function classItem(x,state){
  var m=x.m,c=x.c;
  return '<div class="card cls" style="--c:'+esc(m.color)+'" data-act="mat" data-id="'+m.id+'">'+
    '<div class="cls-t"><b>'+esc(c.ini)+'</b>'+(c.fin?'<span>'+esc(c.fin)+'</span>':'')+'</div>'+
    '<div class="cls-b"><b>'+esc(m.nombre)+'</b>'+(m.docente?'<span>'+esc(m.docente)+'</span>':'')+(m.horario?'<span>'+esc(m.horario)+'</span>':'')+'</div>'+
    (state?'<span class="tag '+(state==="now"?"live":"soon")+'">'+(state==="now"?"En curso":"Próxima")+'</span>':'')+'</div>';
}
function clsText(m){
  return (m.clases||[]).slice().sort(function(a,b){return DORDER.indexOf(+a.d)-DORDER.indexOf(+b.d)||a.ini.localeCompare(b.ini)})
    .map(function(c){return DIAS[c.d]+" "+c.ini+(c.fin?"–"+c.fin:"")}).join(" · ");
}

function seg(key,opts,cur){
  return '<div class="chips mini-seg">'+opts.map(function(o){
    return '<button class="fchip'+(cur===o[0]?" on":"")+'" data-act="ui" data-k="'+key+'" data-v="'+o[0]+'">'+o[1]+'</button>';
  }).join("")+'</div>';
}
function vAjustes(){
  var u=S.ui,gv=u.glass==null?(isDark()?0.46:0.34):u.glass;
  return '<h3 class="sec">Apariencia</h3><div class="card set">'+
    '<div class="set-r"><span>Modo</span>'+seg("theme",[["auto","Automático"],["light","Claro"],["dark","Oscuro"]],u.theme)+'</div>'+
    '<div class="set-r"><span>Transparencia del vidrio</span><input type="range" id="ui_glass" min="0" max="100" step="1" value="'+Math.round(gv*100)+'" aria-label="Transparencia del vidrio">'+
      '<div class="set-sc"><small>Transparente</small><small>Sólido</small></div></div>'+
    '<div class="set-r"><span>Rebote de la barra de abajo</span>'+seg("spring",[["soft","Suave"],["normal","Normal"],["strong","Marcado"]],u.spring)+'</div>'+
    '<button class="btn ghost" data-act="uiReset">Restablecer apariencia</button></div>';
}

function vCampus(){
  var next=listItems().filter(function(e){return !e.hecho}).sort(cmp).slice(0,3);
  var tl=classesOn(today0().getDay()),h="";
  if(!canStore)h+='<div class="warn">Este navegador no permite guardar datos: lo que cargues se pierde al cerrar. Usá «Copia de seguridad» para no perderlo.</div>';
  h+='<section class="hero"><div class="hero-top"><div class="logo-plate big"><img src="'+LOGO+'" alt="Logo del ISFD N° 84"></div>'+
     '<div><p class="eyebrow">Campus Virtual</p><h1>Instituto Superior de Formación Docente N°&nbsp;84</h1><p class="sub">Mar del Plata</p></div></div>'+
     '<a class="btn cta" href="'+URL_ACCESO+'" target="_blank" rel="noopener noreferrer">'+ico("ext",18)+' Ingresar al campus</a>'+
     '<a class="btn ghost" href="'+URL_AUTOG+'" target="_blank" rel="noopener noreferrer">'+ico("ext",18)+' Autogestión (ETNA)</a>'+
     '<p class="hint">'+ico("shield",15)+'<span>Tu usuario y tu clave los escribís en los sitios oficiales. Esta app nunca los pide ni los guarda.</span></p></section>';
  if(tl.length){
    var st=classStates(tl,true);
    h+='<h3 class="sec">Clases de hoy</h3>'+tl.map(function(x,i){return classItem(x,st[i])}).join("");
  }
  if(next.length){
    h+='<h3 class="sec">Lo que viene</h3>'+next.map(evItem).join("");
  }
  h+='<h3 class="sec">Accesos rápidos</h3><div class="grid">'+QUICK.map(function(l){
    return '<a class="tile" href="'+l.u+'" target="_blank" rel="noopener noreferrer">'+'<span class="ic">'+ico(l.i,22)+'</span><b>'+esc(l.t)+'</b><small>'+esc(l.s)+'</small></a>';
  }).join("")+'</div>';
  h+='<h3 class="sec">Mis enlaces <button class="mini" data-act="addLink">+ Agregar</button></h3>';
  if(S.links.length){
    h+=S.links.map(function(l){
      return '<div class="link-row"><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+ico("link",20)+'<span>'+esc(l.nombre)+'</span></a>'+
             '<button class="ib" data-act="delLink" data-id="'+l.id+'" aria-label="Quitar enlace">×</button></div>';
    }).join("");
  }else{
    h+='<div class="empty">Guardá acá los enlaces que más usás (un aula, un Drive, un PDF de la cátedra).</div>';
  }
  h+=vAjustes();
  h+='<h3 class="sec">Tus datos</h3><button class="btn ghost" data-act="backup">'+ico("save",18)+' Copia de seguridad</button>'+
     '<p class="hint" style="margin-top:8px">Todo lo que cargues se guarda solo en este dispositivo. Con la copia de seguridad lo podés pasar a otro.</p>'+
     '<p class="foot">App personal de estudio. No es la aplicación oficial del instituto ni del campus.</p>';
  return h;
}

function groups(){
  var all=listItems();
  var pend=all.filter(function(e){return !e.hecho}).sort(cmp);
  var done=all.filter(function(e){return e.hecho}).sort(function(a,b){return cmp(b,a)});
  var g=[];
  if(filter!=="done"){
    [["Vencidas",function(n){return n<0},"late"],["Hoy",function(n){return n===0},""],["Próximos 7 días",function(n){return n>0&&n<=7},""],["Más adelante",function(n){return n>7},""]].forEach(function(b){
      var items=pend.filter(function(e){return b[1](diffDays(e.fecha))});
      if(items.length)g.push({t:b[0],items:items,c:b[2]});
    });
  }
  if(filter!=="pend"&&done.length)g.push({t:"Hechas",items:done,c:""});
  return g;
}
function vAgenda(){
  var h='<div class="chips narrow">'+[["list","Lista"],["month","Mes"]].map(function(f){
    return '<button class="fchip'+(agMode===f[0]?" on":"")+'" data-act="agMode" data-v="'+f[0]+'">'+f[1]+'</button>';
  }).join("")+'</div>';
  return h+(agMode==="month"?vMonth():vList());
}
function vList(){
  var all=listItems(),np=all.filter(function(e){return !e.hecho}).length,nd=all.length-np;
  var h='<div class="chips">'+[["pend","Pendientes ("+np+")"],["done","Hechas ("+nd+")"],["all","Todas"]].map(function(f){
    return '<button class="fchip'+(filter===f[0]?" on":"")+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'</button>';
  }).join("")+'</div>';
  var g=groups();
  if(!g.length){
    h+='<div class="empty" style="margin-top:12px"><b>'+(S.eventos.length?"Nada por acá":"Tu agenda está vacía")+'</b>'+
       (S.eventos.length?"No hay eventos en este filtro.":"Tocá + para cargar una entrega, un parcial, un final o una clase.")+'</div>';
  }else{
    h+=g.map(function(x){return '<div class="group '+x.c+'"><div class="group-t">'+x.t+'</div>'+x.items.map(evItem).join("")+'</div>'}).join("");
  }
  return h;
}
function vMonth(){
  var first=new Date(calY,calM,1),lead=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  var start=dn(iso(first))-lead,cells=Math.ceil((lead+dim)/7)*7,from=fromDn(start),to=fromDn(start+cells-1);
  var map={};
  S.eventos.forEach(function(e){occIn(e,from,to).forEach(function(d){(map[d]=map[d]||[]).push(e)})});
  var todayI=iso(today0());
  var h='<div class="card cal"><div class="cal-h"><button class="ib" data-act="calPrev" aria-label="Mes anterior">‹</button>'+
    '<b data-act="calToday">'+MLONG[calM]+' '+calY+'</b><button class="mini" data-act="calToday">Hoy</button>'+
    '<button class="ib" data-act="calNext" aria-label="Mes siguiente">›</button></div>'+
    '<div class="cal-w">'+["L","M","M","J","V","S","D"].map(function(s){return '<span>'+s+'</span>'}).join("")+'</div><div class="cal-g">';
  for(var i=0;i<cells;i++){
    var d=fromDn(start+i),inM=(+d.slice(5,7)-1)===calM,evs=map[d]||[];
    var dots=evs.slice(0,3).map(function(e){var m=matById(e.materia);return '<u style="--c:'+(m?esc(m.color):"var(--red)")+'"></u>'}).join("");
    h+='<button class="cd'+(inM?"":" out")+(d===todayI?" today":"")+(d===calSel?" sel":"")+'" data-act="calSel" data-d="'+d+'"><span>'+(+d.slice(8))+'</span><i>'+dots+'</i></button>';
  }
  h+='</div></div>';
  return h+dayPanel(calSel);
}
function dayPanel(d){
  var dt=parseD(d),dow=dt.getDay(),items=itemsOn(d),cls=classesOn(dow);
  var h='<h3 class="sec">'+DLONG[dow]+' '+dt.getDate()+' de '+MLONG[dt.getMonth()]+' <button class="mini" data-act="addOn" data-d="'+d+'">+ Evento</button></h3>';
  if(cls.length){var st=classStates(cls,d===iso(today0()));h+=cls.map(function(x,i){return classItem(x,st[i])}).join("")}
  if(items.length)h+=items.map(evItem).join("");
  if(!cls.length&&!items.length)h+='<div class="empty">No hay nada este día.</div>';
  return h;
}

  if(!S.materias.length)return '<div class="empty"><b>Todavía no cargaste materias</b>Tocá + para agregar la primera. Después las vas a poder elegir en la agenda y armar tu horario.</div>';

function vHorario(){
  var any=S.materias.some(function(m){return (m.clases||[]).length});
  if(!any)return '<div class="empty"><b>Todavía no cargaste horarios</b>Abrí una materia y agregá los días y las horas de cursada: acá se arma tu semana.</div>'+
    '<div class="actions"><button class="btn primary" data-act="go" data-v="materias">Ir a Materias</button></div>';
  var td=today0().getDay(),h="";
  DORDER.forEach(function(k){
    var list=classesOn(k),isT=k===td,st=classStates(list,isT);
    h+='<div class="group"><div class="group-t'+(isT?" today":"")+'">'+DLONG[k]+(isT?'<span class="tag soon">Hoy</span>':"")+'</div>'+
      (list.length?list.map(function(x,i){return classItem(x,st[i])}).join(""):'<div class="none">Sin clases</div>')+'</div>';
  });
  return h;
}

/* ---------- render ---------- */
var TABS=[["campus","Campus"],["agenda","Agenda"],["horario","Horario"],["materias","Materias"]];
var tabsEl,pill,tabBtns=[],drag=null;

/* barra inferior tipo slider.
   Mientras el dedo está apoyado no se lee el layout ni se redibuja contenido: se miden las pestañas
   una sola vez, se sigue el dedo con requestAnimationFrame y recién al soltar se cambia la pantalla. */
function buildTabs(){
  tabsEl=$("#tabs");
  tabsEl.innerHTML='<span class="pill" aria-hidden="true"></span>'+TABS.map(function(t){
    return '<button class="tab" data-act="tab" data-v="'+t[0]+'">'+ico(t[0],24)+'<span>'+t[1]+'</span></button>';
  }).join("");
  pill=tabsEl.querySelector(".pill");
  tabBtns=[].slice.call(tabsEl.querySelectorAll(".tab"));
  tabsEl.addEventListener("pointerdown",onDown);
  tabsEl.addEventListener("pointermove",function(e){if(drag&&e.pointerId===drag.id)setTarget(e)});
  tabsEl.addEventListener("pointerup",function(e){if(drag&&e.pointerId===drag.id)endDrag(false)});
  tabsEl.addEventListener("pointercancel",function(e){if(drag&&e.pointerId===drag.id)endDrag(true)});
  tabsEl.addEventListener("lostpointercapture",function(e){if(drag&&e.pointerId===drag.id)endDrag(true)});
  window.addEventListener("resize",function(){if(!drag)placePill(curIdx(),false)});
  /* respaldo: si el levantar el dedo no llega a la barra, igual se cierra el gesto */
  window.addEventListener("pointerup",function(e){if(drag&&e.pointerId===drag.id)endDrag(false)});
  window.addEventListener("pointercancel",function(){if(drag)endDrag(true)});
  window.addEventListener("blur",function(){if(drag)endDrag(true)});
  document.addEventListener("visibilitychange",function(){if(document.hidden&&drag)endDrag(true)});
}
function curIdx(){var i=0;TABS.forEach(function(t,k){if(t[0]===view)i=k});return i}
function placePill(i,animate){
  var b=tabBtns[i];if(!b||!pill)return;
  if(!animate)pill.style.transition="none";
  pill.style.width=b.offsetWidth+"px";
  pill.style.transform="translate3d("+b.offsetLeft+"px,0,0)";
  if(!animate){void pill.offsetWidth;pill.style.transition=""}
}
function idxAt(m,left){
  var c=left+m.w/2,idx=0,best=1e9;
  m.lefts.forEach(function(l,i){var d=Math.abs(l+m.w/2-c);if(d<best){best=d;idx=i}});
  return idx;
}
function onDown(e){
  if(e.button>0||e.isPrimary===false)return;
  if(drag)endDrag(true);            /* si quedó un gesto colgado (toque cancelado por el sistema), se limpia y se sigue */
  var r=tabsEl.getBoundingClientRect(),lefts=tabBtns.map(function(b){return b.offsetLeft});
  var m={left:r.left,w:tabBtns[0].offsetWidth,lefts:lefts,min:lefts[0],max:lefts[lefts.length-1]};
  drag={id:e.pointerId,m:m,idx:curIdx(),hot:-1,tx:lefts[curIdx()],cx:lefts[curIdx()],last:"",raf:0};
  try{tabsEl.setPointerCapture(e.pointerId)}catch(x){}
  pill.style.width=m.w+"px";
  tabsEl.classList.add("pressed");
  setTarget(e);
  drag.raf=requestAnimationFrame(tick);
}
function setTarget(e){
  var d=drag,m=d.m;
  d.tx=Math.max(m.min,Math.min(m.max,e.clientX-m.left-m.w/2));
  var idx=idxAt(m,d.tx);
  if(idx!==d.hot){
    d.hot=idx;d.idx=idx;
    for(var i=0;i<tabBtns.length;i++)tabBtns[i].classList.toggle("hot",i===idx);
  }
}
function tick(){
  var d=drag;if(!d)return;
  var diff=d.tx-d.cx;
  d.cx=Math.abs(diff)<0.25?d.tx:d.cx+diff*0.4;   /* sigue al dedo con un poco de inercia */
  var t="translate3d("+d.cx.toFixed(2)+"px,0,0)";
  if(t!==d.last){pill.style.transform=t;d.last=t}
  d.raf=requestAnimationFrame(tick);
}
function endDrag(cancel){
  if(!drag)return;
  var d=drag,idx=cancel?curIdx():d.idx;
  drag=null;cancelAnimationFrame(d.raf);
  tabsEl.classList.remove("pressed");
  if(idx!==curIdx()){
    view=TABS[idx][0];
    syncTabs(true);                                  /* la píldora arranca su rebote ya */
    requestAnimationFrame(function(){requestAnimationFrame(function(){renderContent();window.scrollTo(0,0)})});
  }else syncTabs(true);
}
function syncTabs(animate){
  var ci=curIdx();
  for(var i=0;i<tabBtns.length;i++){
    var b=tabBtns[i];
    b.classList.toggle("on",i===ci);b.classList.remove("hot");
    if(i===ci)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  }
  if(!drag)placePill(ci,animate!==false);
}
function render(){syncTabs(true);renderContent()}
function renderContent(){
  var fn={campus:vCampus,agenda:vAgenda,horario:vHorario,materias:vMaterias}[view];
  $("#view").innerHTML=fn();
  var fab=$("#fab");fab.hidden=(view==="campus"||view==="horario");fab.innerHTML=ico("plus",26);
  try{$("#hdrSub").textContent=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}catch(e){}
}

function clsRow(c){

  return '<div class="crow"><div class="crow-top"><select class="c_d" aria-label="Día">'+DORDER.map(function(k){return '<option value="'+k+'"'+(+c.d===k?" selected":"")+'>'+DLONG[k]+'</option>'}).join("")+'</select>'+

/* ---------- acciones ---------- */
function act(a,d,el){
  var x;
  switch(a){
    case "tab": case "go": view=d.v;render();window.scrollTo(0,0);break;
    case "fab": if(view==="agenda")evSheet(null,agMode==="month"?calSel:null);else if(view==="materias")matSheet();break;
    case "agMode": agMode=d.v;render();break;
    case "calPrev": case "calNext":{
      calM+=a==="calNext"?1:-1;
      if(calM<0){calM=11;calY--}else if(calM>11){calM=0;calY++}
      var ym=calY+"-"+pad(calM+1),t0=iso(today0());
      if(calSel.slice(0,7)!==ym)calSel=t0.slice(0,7)===ym?t0:ym+"-01";
      render();break;}
    case "calToday": calY=today0().getFullYear();calM=today0().getMonth();calSel=iso(today0());render();break;
    case "calSel": calSel=d.d;if(+d.d.slice(5,7)-1!==calM){calM=+d.d.slice(5,7)-1;calY=+d.d.slice(0,4)}render();break;
    case "addOn": evSheet(null,d.d);break;
    case "addRow": $("#rows").insertAdjacentHTML("beforeend",clsRow());break;
    case "delRow": if(el&&el.closest(".crow"))el.closest(".crow").remove();break;
    case "ui": S.ui[d.k]=d.v;save();applyUI();renderContent();break;
    case "uiReset": S.ui={theme:"auto",glass:null,spring:"normal"};save();applyUI();renderContent();toast("Apariencia restablecida");break;
    case "filter": filter=d.v;render();break;
    case "close": closeSheet();break;
    case "toggle":
      x=S.eventos.find(function(e){return e.id===d.id});
      if(x){
        if(x.rep){x.done=x.done||[];var k=x.done.indexOf(d.d);if(k>=0)x.done.splice(k,1);else x.done.push(d.d)}
        else x.hecho=!x.hecho;
        commit();
      }
      break;
    case "ev": evSheet(d.id);break;
    case "mat": matSheet(d.id);break;
    case "addLink": linkSheet();break;
    case "backup": backupSheet();break;
    case "swatch":
      document.querySelectorAll(".sw").forEach(function(b){b.classList.toggle("on",b.dataset.c===d.c)});
      $("#m_c").value=d.c;break;

    case "saveEv":{
      var titulo=$("#f_t").value.trim(),fecha=$("#f_fecha").value,rp=$("#f_rep").value,hasta=$("#f_hasta").value;
      if(!titulo)return fe("Escribí un título.");
      if(!fecha)return fe("Elegí una fecha.");
      if(rp&&hasta&&hasta<fecha)return fe("La fecha límite tiene que ser posterior al inicio.");
      var o={titulo:titulo,tipo:$("#f_tipo").value,materia:$("#f_mat").value,fecha:fecha,hora:$("#f_hora").value,nota:$("#f_nota").value.trim()};
      if(d.id){
        var ex=S.eventos.find(function(e){return e.id===d.id});
        Object.assign(ex,o);
        if(rp){ex.rep=rp;ex.hasta=hasta;ex.done=ex.done||[]}else{delete ex.rep;delete ex.hasta;delete ex.done}
      }else{
        o.id=uid();o.hecho=false;
        if(rp){o.rep=rp;o.hasta=hasta;o.done=[]}
        S.eventos.push(o);
      }
      closeSheet();commit();toast("Guardado");break;}
    case "delEv": x=S.eventos.find(function(e){return e.id===d.id});confirmSheet(x&&x.rep?"¿Eliminar este evento y todas sus repeticiones?":"¿Eliminar este evento?","delEvYes",d.id);break;
    case "delEvYes": S.eventos=S.eventos.filter(function(e){return e.id!==d.id});closeSheet();commit();toast("Eliminado");break;

    case "saveMat":{
      var nombre=$("#m_n").value.trim();
      if(!nombre)return fe("Escribí el nombre de la materia.");
      var cl=[],bad="";
      document.querySelectorAll("#rows .crow").forEach(function(r){
        var dd=+r.querySelector(".c_d").value,ini=r.querySelector(".c_i").value,fin=r.querySelector(".c_f").value;
        if(!ini){bad="Completá la hora de inicio de cada horario (o quitá el que no uses).";return}
        if(fin&&fin<=ini){bad="La hora de fin tiene que ser posterior a la de inicio.";return}
        cl.push({d:dd,ini:ini,fin:fin});
      });
      if(bad)return fe(bad);
      var m={nombre:nombre,docente:$("#m_d").value.trim(),horario:$("#m_h").value.trim(),color:$("#m_c").value,clases:cl};
      if(d.id){Object.assign(matById(d.id),m)}else{m.id=uid();S.materias.push(m)}
      closeSheet();commit();toast("Guardado");break;}
    case "delMat": x=matById(d.id);confirmSheet('¿Eliminar la materia "'+(x?x.nombre:"")+'"? Sus eventos se mantienen como «Sin materia».',"delMatYes",d.id);break;
    case "delMatYes":
      S.materias=S.materias.filter(function(m){return m.id!==d.id});
      S.eventos.forEach(function(e){if(e.materia===d.id)e.materia=""});
      S.apuntes.forEach(function(n){if(n.materia===d.id)n.materia=""});
      closeSheet();commit();toast("Eliminada");break;

    case "saveLink":{
      var ln=$("#l_n").value.trim(),lu=normUrl($("#l_u").value);
      if(!lu)return fe("Poné una dirección válida, por ejemplo https://…");
      S.links.push({id:uid(),nombre:ln||lu.replace(/^https?:\/\/(www\.)?/,"").split("/")[0],url:lu});
      closeSheet();commit();toast("Enlace guardado");break;}
    case "delLink": S.links=S.links.filter(function(l){return l.id!==d.id});commit();break;

    case "copyBackup":{
      var ta=$("#bk_out");
      var fallback=function(){ta.focus();ta.select();toast("Texto seleccionado: copialo")};
      try{navigator.clipboard.writeText(ta.value).then(function(){toast("Copiado")},fallback)}catch(e){fallback()}
      break;}
    case "restore":{
      var raw=$("#bk_in").value.trim(),o2;
      if(!raw)return fe("Pegá primero la copia de seguridad.");
      try{o2=JSON.parse(raw);if(o2&&o2.data)o2=o2.data}catch(e){return fe("Ese texto no es una copia válida.")}
      if(!o2||typeof o2!=="object"||!["materias","eventos"].every(function(k){return Array.isArray(o2[k])}))return fe("Ese texto no es una copia válida.");
      S={materias:o2.materias,eventos:o2.eventos,apuntes:Array.isArray(o2.apuntes)?o2.apuntes:[],links:Array.isArray(o2.links)?o2.links:[],ui:o2.ui};
      normalize();save();applyUI();
      closeSheet();render();toast("Datos restaurados");break;}
  }
}

document.addEventListener("click",function(e){
  if(e.target.id==="overlay"){closeSheet();return}
  var t=e.target.closest("[data-act]");
  if(t&&t.dataset.act==="tab"&&e.detail!==0)return;
  if(t)act(t.dataset.act,t.dataset,t);
});
function blankField(e){var t=e.target;if(t&&t.matches&&t.matches("input[type=time],input[type=date]"))t.classList.toggle("blank",!t.value)}
document.addEventListener("change",function(e){blankField(e);if(e.target.id==="f_rep")$("#f_hasta_w").hidden=!e.target.value});
document.addEventListener("input",function(e){
  blankField(e);
  if(e.target.id==="ui_glass"){S.ui.glass=(+e.target.value)/100;applyUI();save()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#overlay").hidden)closeSheet()});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&$("#overlay").hidden)render()});
